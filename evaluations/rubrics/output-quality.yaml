{
  "name": "output-quality",
  "description": "Assess whether outputs are actionable, complete and usable.",
  "scale": {
    "min": 1,
    "max": 5,
    "anchors": {
      "1": "Missing or materially incorrect",
      "3": "Partially correct; notable gaps",
      "5": "Complete, accurate, evidence-aware, and actionable"
    }
  },
  "criteria": [
    {
      "id": "decision_clarity",
      "weight": 25,
      "description": "The decision or recommendation is explicit."
    },
    {
      "id": "completeness",
      "weight": 25,
      "description": "Required deliverable components are present."
    },
    {
      "id": "actionability",
      "weight": 25,
      "description": "Next steps have owners, criteria or measurable outcomes where appropriate."
    },
    {
      "id": "readability",
      "weight": 25,
      "description": "Structure is clear, concise and adapted to the user's request."
    }
  ]
}
