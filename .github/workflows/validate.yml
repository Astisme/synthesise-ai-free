name: Validate and evaluate Synthesise

on:
  push:
    branches: [main, "v*", "v1.2.0-evaluation-foundation"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical skill and contracts
        run: python scripts/validate.py
      - name: Run local parser unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Run deterministic baseline and fixture evaluation
        run: python scripts/evaluate.py --report-dir evaluations/reports
      - name: Upload deterministic JSON and Markdown reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesise-deterministic-evaluation
          path: |
            evaluations/reports/deterministic.json
            evaluations/reports/deterministic.md
          if-no-files-found: error

  windows-v2-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run modular v2 installer regression tests
        shell: pwsh
        run: python -m unittest discover -s scripts -p 'test_install*.py' -v
